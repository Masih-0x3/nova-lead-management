name: nova-local-supabase

# Local-only Supabase stack for Nova Trade development and acceptance.
# Auth + Postgres only — the app never uses PostgREST/Storage/Realtime.
# All credentials in this file are local-only dummies; real values live in
# .env.local (gitignored). Never point this stack at a non-loopback host.

services:
  db:
    image: docker.io/supabase/postgres:15.14.1.170
    container_name: nova-local-db
    restart: unless-stopped
    # TLS is mandatory: the app's Postgres client uses ssl:"require". The
    # entrypoint copies host-mounted certs into postgres-owned /tmp paths so
    # bind-mount ownership does not break the private-key permission check.
    entrypoint: ["sh", "-c", "cp /etc/pg-certs/server.crt /tmp/server.crt && cp /etc/pg-certs/server.key /tmp/server.key && chown postgres:postgres /tmp/server.crt /tmp/server.key && chmod 600 /tmp/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key -c listen_addresses=* -c shared_preload_libraries=pg_stat_statements,pg_net,pg_cron -c cron.database_name=postgres"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGPORT: 5432
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nova-pgdata:/var/lib/postgresql/data
      - ./certs:/etc/pg-certs:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth:
    image: docker.io/supabase/gotrue:v2.197.0
    container_name: nova-local-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000,http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${NOVA_LOCAL_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@localhost
    expose:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Disposable Postgres 16 cluster for the opt-in *-postgres.test.ts suites.
  # Each suite replays migrations into its own uniquely-named rehearsal DB
  # (or self-orchestrates a pinned container); `test-provision` pre-creates the
  # named DBs/roles and pre-migrates the T-027/G-007SR4 rehearsal targets.
  testdb:
    image: docker.io/library/postgres:16-alpine
    container_name: nova-local-testdb
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    image: docker.io/library/nginx:alpine
    container_name: nova-local-gateway
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro,Z

volumes:
  nova-pgdata:
